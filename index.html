<!doctype html>
<html lang="en">
<style>html,body{margin:0}body{font-family:system-ui,sans-serif}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>BITEBACK Smart Prompts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout concept: a phone app and a desktop console share one data store. The recurring mark is a "bite" taken out of a card corner. */
:root{
  color-scheme:light;
  --warm:#F5F3EE;--cobalt:#293B64;--peri:#A9B9D8;--lav:#D6C9E8;--sand:#E8D7B9;--ink:#25272D;--white:#FFFFFF;
  --muted:#5A5F70;--line:#E3DFD6;--peri-soft:#E4E9F3;--lav-soft:#EFE9F6;--sand-soft:#F5ECDD;--cobalt-2:#3A5088;
  --head:"Space Grotesk","Avenir Next",system-ui,sans-serif;--body:"DM Sans","Helvetica Neue",system-ui,sans-serif;
  --r-lg:22px;--r-md:14px;--r-sm:10px;--shadow:0 1px 2px rgba(41,59,100,.07),0 6px 18px rgba(41,59,100,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#E9E6DF;color:var(--ink);font:400 14px/1.45 var(--body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--head);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
svg{display:block;flex:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--head);font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12.5px}
.shell{height:100%;display:flex;flex-direction:column}
.topbar{flex:none;display:flex;align-items:center;gap:12px;background:var(--white);border-bottom:1px solid var(--line);padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font:700 17px var(--head);letter-spacing:.02em;color:var(--cobalt)}
.logo{width:26px;height:26px}
.seg{display:inline-flex;background:var(--warm);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--cobalt);color:#fff}
.topbar .seg{margin-inline:auto}
.field-inline{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
select{background:var(--white);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px;font-weight:500}
main{flex:1;min-height:0;overflow:hidden}

/* Student stage */
.stage{height:100%;display:flex;justify-content:center;gap:40px;padding:18px 24px;overflow:hidden}
.guide{width:250px;align-self:center;display:flex;flex-direction:column;gap:18px}
.guide h2{font-size:21px;color:var(--cobalt)}
.guide h3{font:700 11px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.jump{display:grid;gap:3px}
.jump button{padding:7px 10px;border-radius:var(--r-sm);font-weight:500}
.jump button:hover{background:rgba(255,255,255,.7)}
.jump button[aria-current=true]{background:var(--cobalt);color:#fff}
.loop{display:grid;gap:0;list-style:none;margin:0;padding:0}
.loop li{display:flex;gap:9px;align-items:center;padding:3px 0;font-size:13px;color:var(--muted)}
.loop i{width:9px;height:9px;border-radius:50%;background:var(--peri);flex:none}
.loop li.on{color:var(--ink);font-weight:600}.loop li.on i{background:var(--cobalt)}
.phone{width:390px;height:min(844px,100%);flex:none;background:var(--warm);border-radius:38px;border:7px solid var(--ink);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 18px 44px rgba(37,39,45,.22)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 16px 24px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--white);border-top:1px solid var(--line);padding:7px 6px calc(9px + env(safe-area-inset-bottom,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11.5px;font-weight:500;min-height:48px}
.tabs button[aria-current=page]{color:var(--cobalt);background:var(--peri-soft);font-weight:700}

.apphead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;position:relative;color:var(--cobalt);flex:none}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--cobalt);color:#fff;font:700 10.5px/18px var(--body);text-align:center;border:0}
.pagehead h1{font-size:27px;line-height:1.1;color:var(--cobalt)}
.pagehead p{color:var(--muted);margin-top:4px}
.hero{background:var(--cobalt);color:#fff;border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:13px;
  -webkit-mask:radial-gradient(circle 25px at 100% 42px,#0000 97%,#000),radial-gradient(circle 25px at calc(100% - 28px) 8px,#0000 97%,#000),radial-gradient(circle 21px at calc(100% - 64px) -6px,#0000 97%,#000),radial-gradient(circle 34px at 100% 0,#0000 97%,#000);-webkit-mask-composite:source-in;mask:radial-gradient(circle 25px at 100% 42px,#0000 97%,#000),radial-gradient(circle 25px at calc(100% - 28px) 8px,#0000 97%,#000),radial-gradient(circle 21px at calc(100% - 64px) -6px,#0000 97%,#000),radial-gradient(circle 34px at 100% 0,#0000 97%,#000);mask-composite:intersect}
.hero h1{font-size:29px;line-height:1.05}
.hero .sub{color:#D5DDEE}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.progress{height:7px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--sand);border-radius:4px}
.section{display:flex;flex-direction:column;gap:10px}
.section>h2,.sechead h2{font-size:18px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{color:var(--cobalt);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--white);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px}
.meal{border-radius:var(--r-lg);padding:6px;display:flex;flex-direction:column}
.meal.Breakfast{background:var(--sand)}.meal.Lunch{background:var(--peri)}.meal.Dinner{background:var(--lav)}
.mealhead{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 10px}
.mealhead h2{font-size:18px}
.mealhead span{font-size:12.5px;font-weight:500}
.dishes{background:var(--white);border-radius:17px;overflow:hidden}
.dish{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
.dish:first-child{border-top:0}
.dishmain{display:flex;align-items:center;gap:10px;flex:1;min-width:0;min-height:44px}
.dishmain b{display:block;font-weight:600;line-height:1.2}
.thumb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--cobalt);background:var(--peri-soft);flex:none}
.thumb.Breakfast{background:var(--sand-soft)}.thumb.Dinner{background:var(--lav-soft)}
.pillbtn{padding:8px 13px;border-radius:999px;background:var(--cobalt);color:#fff;font-weight:600;font-size:13px;white-space:nowrap;min-height:36px}
.ghost{padding:8px 11px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:12.5px;color:var(--cobalt);white-space:nowrap;background:var(--white)}
.stars{display:inline-flex;gap:1px;color:var(--cobalt);vertical-align:-2px}
.stars svg{width:13px;height:13px}
.stars .off{color:#CFD4E0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:var(--r-md);padding:12px 10px;min-width:0}
.stat .num{display:block;font-size:25px;line-height:1.1;color:var(--cobalt)}
.stat span:last-child{font-size:12px;color:#3D4152;line-height:1.2;display:block;margin-top:3px}
.bg-peri{background:var(--peri-soft)}.bg-lav{background:var(--lav)}.bg-sand{background:var(--sand)}.bg-pl{background:var(--peri)}.bg-w{background:var(--white)}
.insight{display:flex;gap:9px;align-items:flex-start}
.comeback{display:flex;width:100%;gap:11px;align-items:center;background:var(--lav);border-radius:var(--r-md);padding:12px}
.comeback .thumb{background:var(--white)}
.comeback b{font:700 15.5px/1.2 var(--head);display:block}

/* Rating */
.backrow{display:flex;gap:10px;align-items:center}
.backrow h1{font-size:21px;line-height:1.15;color:var(--cobalt)}
.rategrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rateopt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 0 8px;border-radius:var(--r-md);background:var(--white);border:1.5px solid var(--line);color:var(--peri);transition:background .12s,transform .12s}
.rateopt svg{width:30px;height:30px}
.rateopt span{font:700 13px var(--head);color:var(--muted)}
.rateopt.fill{background:var(--peri-soft);border-color:var(--peri);color:var(--cobalt)}
.rateopt.sel{background:var(--cobalt);border-color:var(--cobalt);color:#fff}.rateopt.sel span{color:#fff}
.ratelabel{text-align:center;font:700 16px var(--head);color:var(--cobalt);min-height:23px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 12px;border-radius:999px;background:var(--white);border:1.5px solid var(--line);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:5px;min-height:36px}
.chip[aria-pressed=true]{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.chip.static{min-height:0;padding:3px 9px;font-size:11.5px;background:var(--lav-soft);border:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{padding:13px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--white);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.choice.yes[aria-pressed=true]{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.choice.no[aria-pressed=true]{background:var(--sand);border-color:var(--ink)}
textarea,.txt{width:100%;border:1.5px solid var(--line);background:var(--white);border-radius:var(--r-md);padding:10px 12px;resize:none}
.footer-cta{flex:none;background:var(--white);border-top:1px solid var(--line);padding:11px 16px calc(13px + env(safe-area-inset-bottom,0px))}
.primary{display:block;width:100%;text-align:center;background:var(--cobalt);color:#fff;font-weight:700;font-size:15.5px;padding:14px;border-radius:var(--r-md)}
.primary:disabled{background:#C9CFDC;color:#555B6B;cursor:not-allowed}
.secondary{display:block;width:100%;text-align:center;border:1.5px solid var(--cobalt);color:var(--cobalt);font-weight:700;padding:12px;border-radius:var(--r-md);background:transparent}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.tick{width:68px;height:68px;border-radius:50%;background:var(--cobalt);color:#fff;display:grid;place-items:center;margin-inline:auto}
.tick .ic{width:32px;height:32px}

/* Taste */
.rowlist{display:flex;flex-direction:column;background:var(--white);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);width:100%}
.row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.grow b{font-weight:600;display:block;line-height:1.25}
.favs{display:flex;gap:9px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}
.fav{flex:0 0 150px;background:var(--lav);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:8px;position:relative}
.fav .thumb{background:var(--white)}
.fav b{font:700 15px/1.15 var(--head);min-height:35px}
.fav .x{position:absolute;right:7px;top:7px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.65);color:var(--cobalt)}
.heat{display:grid;grid-template-columns:minmax(0,1fr) repeat(5,32px);gap:3px;align-items:center;font-size:12.5px}
.heat .h{text-align:center;color:var(--muted);font-size:11.5px;font-weight:600}
.cell{height:30px;border-radius:7px;display:grid;place-items:center;font:700 12px var(--head)}

/* Notifications */
.notif{display:flex;flex-direction:column;gap:9px;width:100%;border-radius:var(--r-md);padding:14px;position:relative}
.notif.a{background:var(--peri)}.notif.b{background:var(--lav)}
.notif h3{font-size:18px;line-height:1.15}
.notif .kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:13px}
.notif .kv span:nth-child(odd){color:#3B3F4E}.notif .kv span:nth-child(even){font-weight:600}
.dot{position:absolute;top:14px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--cobalt)}
.empty{border:1.5px dashed #C8C3B8;border-radius:var(--r-md);padding:14px;color:var(--muted);font-size:13px}

/* Feedback */
.bigcard{background:var(--cobalt);color:#fff;border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px}
.bigcard .big{font:700 52px/1 var(--head)}
.bigcard .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid rgba(255,255,255,.22);padding-top:12px}
.bigcard .pair b{font:700 21px var(--head);display:block}
.tagpill{display:inline-block;background:rgba(255,255,255,.15);padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.samplepill{display:inline-block;background:var(--sand);color:var(--ink);padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.barrow{display:grid;grid-template-columns:minmax(0,130px) 1fr 44px;gap:9px;align-items:center;font-size:13px;padding:4px 0}
.track{height:10px;border-radius:0 4px 4px 0;background:var(--peri-soft)}
.track span{display:block;height:100%;background:var(--cobalt);border-radius:0 4px 4px 0}
.track.warm span{background:#8A7346}
.barrow .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* Profile */
.avatar{width:62px;height:62px;border-radius:50%;background:var(--cobalt);color:#fff;display:grid;place-items:center;font:700 25px var(--head);flex:none}
.switch{width:46px;height:28px;border-radius:14px;background:#C5C9D4;position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;width:22px;height:22px;top:3px;left:3px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked=true]{background:var(--cobalt)}.switch[aria-checked=true]::after{left:21px}
.sheetwrap{position:absolute;inset:0;background:rgba(37,39,45,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--warm);width:100%;border-radius:22px 22px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:13px;max-height:85%;overflow:auto}
.sheet h2{font-size:21px;color:var(--cobalt)}
.toast{position:absolute;left:14px;right:14px;bottom:86px;background:var(--ink);color:#fff;padding:10px 13px;border-radius:12px;font-weight:500;font-size:13px;z-index:6}

/* Dashboard */
.dash{height:100%;display:flex;background:var(--warm);overflow:hidden}
.side{width:224px;flex:none;background:var(--cobalt);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:3px}
.side .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#C5D0E6;font-weight:700;padding:0 10px 10px}
.side button{display:flex;gap:10px;align-items:center;padding:10px;border-radius:var(--r-sm);font-weight:500;color:#E6EBF5;white-space:nowrap}
.side button:hover{background:rgba(255,255,255,.09)}
.side button[aria-current=page]{background:var(--warm);color:var(--cobalt);font-weight:700}
.side .note{margin-top:auto;font-size:12px;color:#CAD4E8;padding:10px;line-height:1.4}
.dmain{flex:1;min-width:0;overflow:auto;padding:22px 26px 34px}
.dinner{max-width:1240px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.dhead h1{font-size:27px;color:var(--cobalt)}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--white);border-radius:var(--r-md);padding:15px;box-shadow:var(--shadow);min-width:0}
.kpi.lead{background:var(--cobalt);color:#fff}
.kpi .num{display:block;font-size:31px;line-height:1.12;color:var(--cobalt);margin-top:5px}
.kpi.lead .num{color:#fff}.kpi.txt-v .num{font-size:22px;line-height:1.5}
.kpi small{font-size:12.5px;color:var(--muted)}.kpi.lead small{color:#D5DDEE}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.panel{background:var(--white);border-radius:var(--r-md);box-shadow:var(--shadow);padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.panel h2{font-size:16.5px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:720px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{font-weight:600}th button[aria-sort]{color:var(--cobalt);font-weight:700}
td{padding:9px 10px;border-bottom:1px solid #EFECE5;font-size:13.5px}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.status.good{background:var(--peri-soft);color:var(--cobalt)}.status.watch{background:var(--sand);color:#4B3D22}.status.ok{background:var(--lav-soft);color:#3F3556}
.tagtabs{display:flex;flex-wrap:wrap;gap:6px}
.chart text{font:500 11px var(--body);fill:var(--muted)}
#tip{position:fixed;z-index:30;background:var(--ink);color:#fff;padding:5px 9px;border-radius:7px;font-size:12px;pointer-events:none;max-width:240px}
.authed{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:28px;text-align:center}

@media (max-width:1180px){.guide{display:none}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .dash{flex-direction:column}.side{width:100%;flex-direction:row;overflow-x:auto;padding:7px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px));flex:none}.side .lbl,.side .note{display:none}
  .dmain{padding:16px max(16px,env(safe-area-inset-right,0px)) 26px max(16px,env(safe-area-inset-left,0px))}.g2,.g3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .stage{padding:0}.phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .brand span{display:none}.topbar{gap:7px}.seg button{padding:6px 9px;font-size:12px}.field-inline span{display:none}.field-inline select{padding:6px 4px;font-size:12px;max-width:82px}
  .kpi .num{font-size:25px}.kpi.txt-v .num{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.lock{background:#293B64;color:#fff}
.wall{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(circle at calc(100% + 30px) 330px,rgba(169,185,216,.2) 0 140px,transparent 141px),
  radial-gradient(circle at -10px calc(100% - 40px),rgba(214,201,232,.18) 0 190px,transparent 191px),
  radial-gradient(circle at 62% calc(100% + 70px),rgba(232,215,185,.13) 0 130px,transparent 131px)}

const allUpcoming=()=>[...UPCOMING,...S.added].sort((a,b)=>a[0].localeCompare(b[0])||MEALS.indexOf(a[1])-MEALS.indexOf(b[1]));

/* ---------- Shared selectors ---------- */
const byDate=(a,b)=>b.date.localeCompare(a.date)||MEALS.indexOf(b.meal)-MEALS.indexOf(a.meal);
const hist=()=>[...S.records].sort(byDate);
const latest=id=>hist().find(r=>r.d===id);
const todayRec=(id,m)=>S.records.find(r=>r.key===`${TODAY}|${m}|${id}`);
const isFav=id=>S.favs.includes(id);
function eligible(id){const l=latest(id);if(!l)return isFav(id);if(l.s<=2||l.a==='no')return false;return isFav(id)||(l.s>=4&&!S.removed.includes(id))}
function agg(id){
  const d=D[id];let n=d.n,sum=d.avg*d.n,yes=Math.round(d.n*d.repeat);const tags=[...d.tags];
  S.records.filter(r=>r.d===id).forEach(r=>{const o=r.orig;if(!o)n++;sum+=r.s-(o?o.s:0);yes+=(r.a==='yes'?1:0)-(o&&o.a==='yes'?1:0);
    (o?o.t:[]).forEach(t=>tags[TAGS.indexOf(t)]--);r.t.forEach(t=>tags[TAGS.indexOf(t)]++)});
  return {...d,n,avg:sum/n,yes,repeat:yes/n,tags,top:TAGS[tags.indexOf(Math.max(...tags))]};
}
const allAgg=()=>DISHES.map(d=>agg(d.id));
function totals(){const a=allAgg(),n=a.reduce((x,d)=>x+d.n,0),avg=a.reduce((x,d)=>x+d.avg*d.n,0)/n,tags=TAGS.map((t,i)=>({t,c:a.reduce((x,d)=>x+Math.max(0,d.tags[i]),0)}));const all=tags.reduce((x,t)=>x+t.c,0);
  return {n,avg,dishes:a.length,tags:tags.map(t=>({...t,p:t.c/all})).sort((x,y)=>y.c-x.c),req:[...a].sort((x,y)=>y.yes-x.yes)}}
function catStats(){return CATS.map(c=>{const r=S.records.filter(x=>D[x.d].cat===c);return {c,n:r.length,avg:r.length?r.reduce((a,x)=>a+x.s,0)/r.length:0,counts:[1,2,3,4,5].map(s=>r.filter(x=>x.s===s).length)}})}
function insights(){
  const out=[];catStats().forEach(c=>{if(c.n>=3&&c.avg>=4){const t=c.c==='Paneer'?'Enjoys paneer-based dishes':c.c==='South Indian'?'Often rates South Indian breakfasts highly':`Enjoys ${c.c.toLowerCase()} dishes`;out.push({t,b:`${c.n} ratings, averaging ${f1(c.avg)}/5`})}});
  const sp=S.records.filter(r=>r.t.includes('Too spicy')).length;if(sp>=2)out.push({t:'Prefers moderately spiced food',b:`Marked ${sp} dishes as too spicy`});
  return out}
function myStats(){const r=S.records;return {dishes:new Set(r.map(x=>x.d)).size,count:r.length,avg:r.length?r.reduce((a,x)=>a+x.s,0)/r.length:0,favs:S.favs.length}}
function notifications(){
  const seen=new Set(),up=[];allUpcoming().forEach(([date,meal,d])=>{if(!seen.has(d)&&eligible(d)){seen.add(d);up.push({id:`up:${d}:${date}`,d,date,meal})}});
  const ret=[];MEALS.filter(served).forEach(m=>MENU[m].forEach(d=>{if(eligible(d))ret.push({id:`ret:${d}`,d,date:TODAY,meal:m})}));
  const gen=[];if(S.notif.menu)gen.push({id:'g-menu',t:"Tomorrow's menu is up",b:'See what is planned for Friday lunch.',go:'home'});
  if(S.notif.general)gen.push({id:'g-oil',t:'The mess team is listening',b:'Aloo Paratha is being tested with less oil after student feedback.',go:'feedback'},{id:'g-poha',t:'Poha is getting a rethink',b:'"Needs more flavour" was its top feedback this month.',go:'feedback'});
  return {up:S.notif.returning?up:[],ret:S.notif.returning?ret:[],gen}}
const unread=()=>{const n=notifications();return [...n.up,...n.ret,...n.gen].filter(x=>!S.read.includes(x.id)).length};

/* ---------- Student screens ---------- */
const cur=()=>ui.stack[ui.stack.length-1];
const bell=()=>{const u=unread();return `<button class="iconbtn" data-a="go" data-v="notif" aria-label="Notifications, ${u} unread">${ico('bell')}${u?`<span class="badge">${u}</span>`:''}</button>`};
const head=(t,p)=>`<div class="apphead"><div class="pagehead"><h1>${t}</h1><p>${p}</p></div>${bell()}</div>`;
const backHead=(t,sub)=>`<div class="backrow"><button class="iconbtn" data-a="back" aria-label="Go back">${ico('back')}</button><div class="grow"><h1>${esc(t)}</h1><p class="muted small">${esc(sub)}</p></div></div>`;

function dishRow(id,m){
  const r=todayRec(id,m),on=served(m),skip=S.skipped.includes(`${m}|${id}`),last=latest(id);
  if(!on)return `<div class="dish">${thumb(id,m)}<div class="grow"><b>${D[id].name}</b><span class="muted small">${m===SMEAL?'Unlocks after you check in':'Unlocks after you check in'}</span></div><span class="muted">${ico('lock')}</span></div>`;
  if(r)return `<div class="dish"><button class="dishmain" data-a="rate" data-v="${m}|${id}" aria-label="View or edit your rating for ${D[id].name}">${thumb(id,m)}<span class="grow"><b>${D[id].name}</b>${stars(r.s)} <span class="small" style="font-weight:600;color:var(--cobalt)">Rated</span></span></button><button class="ghost" data-a="rate" data-v="${m}|${id}">Edit</button></div>`;
  if(skip)return `<div class="dish">${thumb(id,m)}<div class="grow"><b>${D[id].name}</b><span class="muted small">You didn't have this</span></div><button class="ghost" data-a="unskip" data-v="${m}|${id}">Undo</button></div>`;
  return `<div class="dish"><button class="dishmain" data-a="rate" data-v="${m}|${id}" aria-label="Rate ${D[id].name}">${thumb(id,m)}<span class="grow"><b>${D[id].name}</b><span class="muted small">${last&&last.s>=4?`Last time: ${last.s}/5`:'Rate this dish'}</span></span></button><button class="pillbtn" data-a="rate" data-v="${m}|${id}" aria-label="Rate ${D[id].name}">Rate</button></div>`;
}
function mealCard(m){
  const ids=MENU[m],done=ids.filter(d=>todayRec(d,m)).length,next=ids.find(d=>!todayRec(d,m)&&!S.skipped.includes(`${m}|${d}`));
  const label=!served(m)?`Served at ${MEAL_TIME[m]}`:`${done} of ${ids.length} rated`;
  const hd=`<span><h2>${m}</h2></span><span>${label}${served(m)&&next?' · Rate next ›':''}</span>`;
  return `<section class="meal ${m}">${served(m)&&next?`<button class="mealhead" data-a="rate" data-v="${m}|${next}" aria-label="${m}: rate next dish, ${D[next].name}">${hd}</button>`:`<div class="mealhead">${hd}</div>`}<div class="dishes">${ids.map(d=>dishRow(d,m)).join('')}</div></section>`;
}

  </section>`;

  const shade=(v)=>v?`background:color-mix(in srgb,var(--cobalt) ${25+v/max*75}%,white);color:${v/max>.3?'#fff':'var(--ink)'}`:'background:var(--warm);color:#9A9DA8';

  <div class="stats"><div class="stat bg-pl"><span class="num">${st.dishes}</span><span>Dishes rated</span></div><div class="stat bg-sand"><span class="num">${f1(st.avg)}</span><span>Average rating</span></div><div class="stat bg-lav"><span class="num">${st.favs}</span><span>Saved favourites</span></div></div>

  <section class="section"><h2>Your Taste Map</h2><div class="card"><div class="heat"><span class="small muted">Stars given</span>${[1,2,3,4,5].map(i=>`<span class="h">${i}</span>`).join('')}${cats.map(c=>`<span style="font-weight:500">${c.c}</span>${c.counts.map((v,i)=>`<span class="cell" style="${shade(v)}" data-tip="${c.c}: ${v} rating${v===1?'':'s'} at ${i+1} stars">${v||''}</span>`).join('')}`).join('')}</div></div></section>

}

function lockCard(){
  const t=S.story,n=t.step,tm=t.times,dishes=MENU[SMEAL].map(d=>D[d].name);
  if(n===1)return `<div class="ncard tap" data-a="openApp" data-v="home">${nHead()}<div class="bioline"><span class="biotick">${ico('check')}</span><div><h3>You're checked in for ${ml}.</h3><p class="small">Biometric done at ${tm.c}. Enjoy your meal! We'll ask how it was after you eat.</p></div></div><p class="small muted">Only your check-in time is shared with BITEBACK, never your fingerprint.</p></div>`;
  if(n===2)return `<div class="ncard">${nHead()}<h3>How was ${ml}?</h3><p class="small muted">${dishes.slice(0,3).join(', ')}${dishes.length>3?' and more':''}</p><div class="lockstars" role="group" aria-label="Rate ${ml}">${[1,2,3,4,5].map(i=>`<button id="lock${i}" data-a="lockStar" data-v="${i}" aria-label="${i} ${i===1?'star':'stars'}, ${STAR_LABEL[i]}">${star(false)}</button>`).join('')}</div><button class="nlink" data-a="lockNot">Not now</button></div>`;
  if(n===3){const low=t.stars<=2;return `<div class="ncard">${nHead()}<div class="rated">${stars(t.stars)}<span class="small">${STAR_LABEL[t.stars]} · Saved</span></div><h3>${low?'Which dish let it down?':'Which dish stood out?'}</h3><div class="chips">${MENU[SMEAL].map(d=>`<button class="chip" id="pick-${d}" data-a="lockDish" data-v="${d}">${D[d].name}</button>`).join('')}</div><button class="nlink" data-a="lockSkip">Skip</button></div>`}
  if(n===4){if(!t.stars)return '';const v=votes(),l=LIVE();return `<div class="ncard tap" data-a="openApp" data-v="feedback">${nHead()}<h3>You and ${l.rated-1} others rated ${ml}.</h3><p>${D[v[0][0]].name} is winning today.</p><div class="minivote">${v.slice(0,3).map(([d,c])=>`<div class="barrow"><span>${D[d].name}</span><span class="track"><span style="width:${c/v[0][1]*100}%"></span></span><span class="v">${c}</span></div>`).join('')}</div><button class="secondary" data-a="openApp" data-v="feedback">See today's results</button></div>`}
  if(n===5)return `<div class="ncard tap" data-a="openApp" data-v="feedback">${nHead()}<span class="eyebrow" style="color:var(--cobalt)">You said, the mess changed it</span><h3>Students said the poha needed more flavour.</h3><p>The mess has updated the recipe for this week. Tell us if it's better.</p></div>`;
  if(n===6){const dd=dosaDate();return `<div class="ncard hl tap" data-a="openPayoff">${nHead()}<span class="eyebrow" style="color:var(--cobalt)">Your favourite is coming back</span><h3>Masala Dosa, which you loved, is back on ${DAYN[dt(dd).getUTCDay()]}.</h3><p class="small">${fmt(dd)} · Breakfast · You rated it 4/5</p><button class="primary" data-a="openPayoff">See the menu</button></div>`}
  return '';
}
function earlier(){
  const t=S.story,n=t.step,tm=t.times,o=LIVE().rated-1,list=[];
  if(n>=6)list.push(compact('Students said the poha needed more flavour.',tm.i,'feedback'));
  if(n>=5)list.push(t.stars?compact(`You and ${o} others rated ${ml}.`,tm.r,'feedback'):compact(`How was ${ml}? Skipped for today.`,tm.p));
  if(n===4&&!t.stars)list.push(compact(`How was ${ml}? Skipped for today.`,tm.p));
  if(n>=2)list.push(compact(`You're checked in for ${ml}. Enjoy your meal!`,tm.c));
  return list.length?`<div class="earlierlbl">${n===4&&!t.stars?'Notifications':'Earlier'}</div>${list.join('')}`:'';
}
function lockPhone(){
  return `<div class="phone lock"><div class="wall"></div>${SB(false)}<div class="lockbody"><div class="lockclock"><span>${lockDate()}</span><b data-clock="1">${clock()}</b></div><div class="lockstack" aria-live="polite">${lockCard()}${earlier()}</div><div class="lockfoot"><span class="lockbtn">${ico('torch')}</span><span class="lockbtn">${ico('camera')}</span></div><button class="homebar" data-a="openApp" data-v="home" aria-label="Open BITEBACK"></button></div></div>`;
}
function student(){return `<div class="stage">${ui.view==='app'?appPhone():lockPhone()}</div>`}
function dResponse(){
  const l=LIVE(),rate=l.rated/l.prompted,v=votes(),fun=[['Scanned in',l.scan],['Sent a prompt',l.prompted],[`Rated ${ml}`,l.rated],['Named a dish',l.named]],week=[['Mon','Breakfast',.38],['Tue','Lunch',.47],['Wed','Dinner',.41],['Thu','Lunch',rate]];
  return `<div class="dhead"><div><h1>Response</h1><p class="muted">${DAYN[dt(TODAY).getUTCDay()]} ${ml} · Prompts sent 40 minutes after each student's check-in</p></div><span class="samplepill">Illustrative sample data</span></div>
  <div class="kpis"><div class="kpi lead"><small>Response rate</small><span class="num" id="respRate">${(rate*100).toFixed(1)}%</span><small>Of students prompted</small></div><div class="kpi"><small>Ate at the mess</small><span class="num">${l.scan}</span><small>From entry records</small></div><div class="kpi"><small>Lunch ratings</small><span class="num" id="respRated">${l.rated}</span><small>Anonymous and combined</small></div><div class="kpi"><small>Prompts paused</small><span class="num">${l.paused}</span><small>After 3 ignored prompts</small></div></div>
  <div class="g2"><div class="panel"><h2>From entry to rating</h2>${fun.map(([a,b])=>hbar(a,b,l.scan,b)).join('')}</div><div class="panel"><h2>Today's standout dishes</h2><p class="small muted">Students who named this dish after a 3 to 5 star meal</p>${v.map(([d,c])=>hbar(D[d].name,c,v[0][1],c)).join('')}</div>
  <div class="panel"><h2>Response rate this week</h2><p class="small muted">One prompt per student per day, rotating across meals</p>${week.map(([d,m,r])=>hbar(`${d} · ${m}`,r,1,pct(r))).join('')}</div><div class="panel"><h2>Privacy by design</h2><p>The prompt system uses one fact from the mess entry system: the time a student entered.</p><p class="muted">Fingerprint data never reaches BITEBACK, and this dashboard shows no names, IDs or individual ratings.</p></div></div>`;
}
function clearDish(){const t=S.story;if(t.dish){const k=`${TODAY}|${SMEAL}|${t.dish}`;S.records=S.records.filter(r=>r.key!==k);if(t.favAdded)S.favs=S.favs.filter(f=>f!==t.dish)}t.dish=null;t.skipDish=false;t.favAdded=false}
function commitDish(d){const t=S.story,k=`${TODAY}|${SMEAL}|${d}`,a=t.stars>=4?'yes':t.stars<=2?'no':null;if(!S.records.some(r=>r.key===k))S.records.push({key:k,d,date:TODAY,meal:SMEAL,s:t.stars,t:[],a,c:''});t.dish=d;if(t.stars===5&&!isFav(d)&&!S.removed.includes(d)){S.favs.push(d);t.favAdded=true}}
let tl;
function schedule(){clearTimeout(tl);const n=S.story.step,d={0:3500+Math.random()*3500,1:16000,4:11000,5:11000}[n];if(d!=null)tl=setTimeout(()=>advance(n+1),d)}
function advance(n){
  const t=S.story,now=clockAP();
  if(n===1)t.times.c=now;if(n===2)t.times.p=now;if(n===5)t.times.i=now;
  t.step=n;
  const b={1:`You're checked in for ${ml}. Enjoy your meal!`,2:`How was ${ml}? Tap to rate.`,5:'Students said the poha needed more flavour.',6:'Masala Dosa, which you loved, is back soon.'}[n];
  if(b&&ui.view==='app'){ui.banner=b;clearTimeout(ui.bt);ui.bt=setTimeout(()=>{ui.banner=null;if(ui.mode==='student')render()},6000)}
  save();if(ui.mode==='student')render();schedule();
}

/* ---------- Render + actions ---------- */
const root=document.getElementById('root');let toastT;
function render(keep=true){
  const sc=root.querySelector('.scroll,#dmain'),top=keep&&sc?sc.scrollTop:0,fid=document.activeElement&&document.activeElement.id;
  root.innerHTML=ui.mode==='student'?student():dashboard();
  document.getElementById('modeSeg').innerHTML=[['student','Student phone'],['dashboard','Mess dashboard']].map(([m,l])=>`<button data-a="mode" data-v="${m}" aria-pressed="${ui.mode===m}">${l}</button>`).join('');
  document.querySelector('.topbar').hidden=ui.mode==='student';
  document.querySelectorAll('#modeSeg button').forEach(b=>{b.innerHTML=b.dataset.v==='student'?'Student<span class="lg"> phone</span>':'Mess<span class="lg"> dashboard</span>'});
  const n=root.querySelector('.scroll,#dmain');if(n)n.scrollTop=top;
  if(fid){const f=document.getElementById(fid);if(f&&root.contains(f))f.focus({preventScroll:true})}
  document.getElementById('tip').hidden=true;
}
const push=o=>{ui.stack.push(o);render(false)};
const toast=m=>{ui.toast=m;clearTimeout(toastT);toastT=setTimeout(()=>{ui.toast=null;render()},2200)};
function openRate(meal,id,date=TODAY){
  if(date===TODAY&&!served(meal))return;
  const key=`${date}|${meal}|${id}`,r=S.records.find(x=>x.key===key);
  ui.draft=r?{key,d:id,date,meal,s:r.s,t:[...r.t],a:r.a,c:r.c,editing:true}:{key,d:id,date,meal,s:0,t:[],a:null,c:'',editing:false};
  if(cur().s==='done')ui.stack.pop();push({s:'rate'});
}
const A={
  mode:v=>{ui.mode=v;try{history.replaceState(null,'','#'+v)}catch(e){}render(false)},
  go:v=>push({s:v}),
  tab:v=>{ui.stack=[{s:v}];render(false)},
  back:()=>{if(ui.stack.length>1)ui.stack.pop();render(false)},
  homeReset:()=>{ui.stack=[{s:'home'}];render(false)},
  jump:v=>{ if(v==='rate'){const m=MEALS.filter(served).reverse().find(x=>MENU[x].some(d=>!todayRec(d,x)))||'Breakfast',d=MENU[m].find(x=>!todayRec(x,m))||MENU[m][0];ui.stack=[{s:'home'}];openRate(m,d)}else{ui.stack=v==='notif'?[{s:'home'},{s:'notif'}]:[{s:v}];render(false)} },
  rate:v=>{const[m,d]=v.split('|');S.skipped=S.skipped.filter(x=>x!==v);openRate(m,d)},
  editRec:v=>{const[date,m,d]=v.split('|');openRate(m,d,date)},
  skip:v=>{S.skipped.push(v);save();render()},unskip:v=>{S.skipped=S.skipped.filter(x=>x!==v);save();render()},
  star:v=>{ui.draft.s=+v;render()},
  tag:v=>{const t=ui.draft.t;ui.draft.t=t.includes(v)?t.filter(x=>x!==v):[...t,v];render()},
  again:v=>{ui.draft.a=ui.draft.a===v?null:v;render()},
  submit:()=>{
    const x=ui.draft;if(!x.s)return;const r=S.records.find(q=>q.key===x.key);
    if(r)Object.assign(r,{s:x.s,t:x.t,a:x.a,c:x.c});else S.records.push({key:x.key,d:x.d,date:x.date,meal:x.meal,s:x.s,t:x.t,a:x.a,c:x.c});
    if(x.s===5&&x.a!=='no'&&!S.removed.includes(x.d)&&!isFav(x.d))S.favs.push(x.d);
    if(x.s<=2||x.a==='no')S.favs=S.favs.filter(f=>f!==x.d);
    ui.loop=3;save();ui.stack.pop();push({s:'done',key:x.key});
  },
  fav:v=>{if(isFav(v)){S.favs=S.favs.filter(x=>x!==v);S.removed=[...new Set([...S.removed,v])];toast(`${D[v].name} removed from favourites`)}else{S.favs.push(v);S.removed=S.removed.filter(x=>x!==v);toast(`${D[v].name} saved to favourites`)}save();render()},
  unfav:v=>{S.favs=S.favs.filter(x=>x!==v);S.removed=[...new Set([...S.removed,v])];save();toast(`${D[v].name} removed from favourites`);render()},
  dish:v=>{const[d,date,meal,id]=v.split('|');if(!S.read.includes(id)){S.read.push(id);save()}ui.loop=5;push({s:'dish',d,date,meal,tab:null})},
  genNotif:v=>{const[id,go]=v.split('|');if(!S.read.includes(id)){S.read.push(id);save()}ui.stack=[{s:go}];render(false)},
  manage:()=>{ui.stack=[{s:'profile'}];render(false);const e=document.getElementById('notif-settings');if(e)e.scrollIntoView({block:'start'})},
  toggle:v=>{const[k,o]=v.split('|');S[k][o]=!S[k][o];save();render()},
  mealPref:v=>{S.mealPrefs=S.mealPrefs.includes(v)?S.mealPrefs.filter(x=>x!==v):[...S.mealPrefs,v];save();render()},
  spice:v=>{S.spice=v;save();render()},
  sheet:v=>{ui.sheet=v;render()},closeSheet:()=>{ui.sheet=null;render()},
  saveName:()=>{const v=document.getElementById('nameInput').value.trim();if(v)S.name=v;ui.sheet=null;save();toast('Profile updated');render()},
  logout:()=>{ui.sheet=null;S.loggedOut=true;save();render(false)},login:()=>{S.loggedOut=false;ui.stack=[{s:'home'}];save();render(false)},
  reset:()=>{S=SEED();ui.stack=[{s:'home'}];ui.loop=0;ui.draft=null;save();render(false)},
  dnav:v=>{ui.dv=v;render(false)},
  dsort:v=>{if(ui.sort===v)ui.dir*=-1;else{ui.sort=v;ui.dir=v==='name'?1:-1}render()},
  dtag:v=>{ui.tag=v;render()},
  planAdd:v=>{const[d,m]=ui.slot.split('|');S.added.push([d,m,v]);save();render()},
  planDel:v=>{const[d,m]=ui.slot.split('|');S.added=S.added.filter(x=>!(x[0]===d&&x[1]===m&&x[2]===v));save();render()},
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  if(b.classList.contains('sheetwrap')&&e.target.closest('[data-stop]'))return;
  const fn=A[b.dataset.a];if(fn)fn(b.dataset.v);
});
document.addEventListener('input',e=>{if(e.target.id==='comment'&&ui.draft)ui.draft.c=e.target.value});
document.addEventListener('change',e=>{
  if(e.target.id==='timeSel'){S.time=+e.target.value;ui.stack=[{s:'home'}];save();render(false)}
  else if(e.target.dataset.c){ui[e.target.dataset.c]=e.target.value;render()}
});
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.hidden=true;return}tip.textContent=t.dataset.tip;tip.hidden=false;tip.style.left=Math.min(innerWidth-tip.offsetWidth-8,e.clientX+12)+'px';tip.style.top=Math.max(6,e.clientY-34)+'px'});
window.addEventListener('hashchange',()=>{const m=location.hash==='#dashboard'?'dashboard':'student';if(m!==ui.mode){ui.mode=m;render(false)}});
Object.assign(A,{
  lockStar:v=>{const t=S.story;t.stars=+v;t.times.r=clockAP();t.step=3;save();render(false)},
  lockDish:v=>{commitDish(v);S.story.step=4;save();render(false);schedule()},
  lockSkip:()=>{S.story.skipDish=true;S.story.step=4;save();render(false);schedule()},
  lockNot:()=>{S.story.dismissed=true;S.story.step=4;save();render(false);schedule()},
  openApp:v=>{ui.view='app';ui.stack=v==='feedback'?[{s:'feedback'}]:[{s:'home'}];render(false)},
  openPayoff:()=>{ui.view='app';ui.stack=[{s:'home'},{s:'dish',d:'dosa',date:dosaDate(),meal:'Breakfast'}];render(false)},
  toLock:()=>{ui.view='lock';ui.banner=null;render(false)},
});
ui.view='lock';
setInterval(()=>{const c=clock();document.querySelectorAll('[data-clock="1"]').forEach(e=>{if(e.textContent!==c)e.textContent=c})},1000);
schedule();
render(false);
</script>
